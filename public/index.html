<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OTTflix</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #141414;
      color: #fff;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: #e50914;
      text-decoration: none;
      cursor: pointer;
    }
    .logo:hover { opacity: 0.8; }
    .search-bar {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-bar input {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      background: #333;
      color: #fff;
      flex: 1;
      min-width: 200px;
    }
    .search-bar input::placeholder { color: #888; }
    main { padding: 2rem; }
    .stats { color: #888; margin-bottom: 1rem; }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }
    .movie-card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #333;
    }
    .movie-info { padding: 0.75rem; }
    .movie-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-meta {
      font-size: 0.75rem;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
    .movie-rating { color: #ffc107; }
    .movie-similarity { color: #4CAF50; font-size: 0.7rem; }
    .loading { text-align: center; padding: 2rem; color: #888; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      overflow-y: auto;
      padding: 2rem;
    }
    .modal-overlay.active { display: flex; justify-content: center; }
    .modal {
      background: #1a1a1a;
      border-radius: 8px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header { position: relative; height: 300px; background: #333; }
    .modal-backdrop { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
    }
    .modal-body { padding: 1.5rem; }
    .modal-title { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .modal-title-ja { font-size: 1rem; color: #888; margin-bottom: 1rem; }
    .modal-genres { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .genre-tag { background: #333; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; }
    .modal-meta { display: flex; gap: 1.5rem; margin-bottom: 1rem; color: #888; font-size: 0.9rem; }
    .modal-overview { line-height: 1.6; color: #ccc; margin-bottom: 2rem; }
    .modal-tagline { font-style: italic; color: #aaa; margin-bottom: 1rem; font-size: 1.1rem; }
    .similar-section h3 { margin-bottom: 1rem; color: #fff; }
    .similar-movies { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; scrollbar-width: none; -ms-overflow-style: none; }
    .similar-movies::-webkit-scrollbar { display: none; }
    .similar-movie { flex-shrink: 0; width: 120px; cursor: pointer; }
    .similar-movie img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 4px; background: #333; }
    .similar-movie p { font-size: 0.75rem; margin-top: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Providers */
    .providers-section { margin-bottom: 2rem; }
    .providers-section h3 { margin-bottom: 1rem; color: #fff; }
    .provider-group { margin-bottom: 1rem; }
    .provider-group-title { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; }
    .provider-list { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .provider-item { display: flex; align-items: center; gap: 0.5rem; background: #333; padding: 0.5rem 0.75rem; border-radius: 6px; }
    .provider-logo { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; background: #444; }
    .provider-name { font-size: 0.85rem; color: #fff; }
    .no-providers { color: #666; font-size: 0.9rem; }

    /* Extended */
    .extended-section { margin-bottom: 2rem; }
    .extended-section h3 { margin-bottom: 1rem; color: #fff; }
    .extended-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .extended-item { background: #252525; padding: 1rem; border-radius: 8px; }
    .extended-label { font-size: 0.75rem; color: #888; margin-bottom: 0.25rem; }
    .extended-value { font-size: 0.95rem; color: #fff; }
    .extended-value a { color: #e50914; text-decoration: none; }
    .extended-value a:hover { text-decoration: underline; }

    /* Videos */
    .videos-section { margin-bottom: 2rem; }
    .videos-section h3 { margin-bottom: 1rem; color: #fff; }
    .video-list { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; scrollbar-width: none; -ms-overflow-style: none; }
    .video-list::-webkit-scrollbar { display: none; }
    .video-item { flex-shrink: 0; width: 280px; cursor: pointer; }
    .video-thumbnail { width: 100%; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; background: #333; }
    .video-name { font-size: 0.85rem; margin-top: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video-type-badge { display: inline-block; background: #e50914; color: #fff; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; margin-top: 0.25rem; }

    /* Video Modal */
    .video-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 300; justify-content: center; align-items: center; }
    .video-modal-overlay.active { display: flex; }
    .video-modal { width: 90%; max-width: 900px; position: relative; }
    .video-modal iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 8px; }
    .video-modal-close { position: absolute; top: -40px; right: 0; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; }

    /* Cast */
    .cast-section { margin-bottom: 2rem; }
    .cast-section h3 { margin-bottom: 1rem; color: #fff; }
    .cast-list { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; scrollbar-width: none; -ms-overflow-style: none; }
    .cast-list::-webkit-scrollbar { display: none; }
    .cast-item { flex-shrink: 0; width: 100px; text-align: center; }
    .cast-photo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #333; margin: 0 auto; }
    .cast-name { font-size: 0.8rem; margin-top: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cast-character { font-size: 0.7rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Crew */
    .crew-section { margin-bottom: 2rem; }
    .crew-section h3 { margin-bottom: 1rem; color: #fff; }
    .crew-list { display: flex; flex-wrap: wrap; gap: 1rem; }
    .crew-item { background: #252525; padding: 0.75rem 1rem; border-radius: 6px; }
    .crew-job { font-size: 0.7rem; color: #888; }
    .crew-name { font-size: 0.9rem; color: #fff; }

    /* Reviews */
    .reviews-section { margin-bottom: 2rem; }
    .reviews-section h3 { margin-bottom: 1rem; color: #fff; }
    .review-list { display: flex; flex-direction: column; gap: 1rem; }
    .review-item { background: #252525; padding: 1rem; border-radius: 8px; }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .review-author { font-weight: 600; color: #fff; }
    .review-rating { color: #ffc107; font-size: 0.9rem; }
    .review-content { font-size: 0.9rem; color: #ccc; line-height: 1.5; max-height: 100px; overflow: hidden; }
    .review-content.expanded { max-height: none; }
    .review-toggle { background: none; border: none; color: #e50914; cursor: pointer; font-size: 0.85rem; margin-top: 0.5rem; padding: 0; }
    .review-date { font-size: 0.75rem; color: #666; margin-top: 0.5rem; }

    /* TMDb Similar */
    .tmdb-similar-section { margin-bottom: 2rem; }
    .tmdb-similar-section h3 { margin-bottom: 1rem; color: #fff; }

    /* Genre Tags */
    .genre-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .genre-tag-btn { padding: 0.4rem 0.8rem; border: 1px solid #444; border-radius: 999px; background: transparent; color: #ccc; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .genre-tag-btn:hover { border-color: #e50914; color: #fff; }
    .genre-tag-btn.active { background: #e50914; border-color: #e50914; color: #fff; }

    /* Personalization */
    .personalization-controls { display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; }
    .upload-btn { background: #e50914; color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; border: none; transition: background 0.2s; }
    .upload-btn:hover { background: #f40612; }
    .clear-btn { background: #333; color: #888; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .clear-btn:hover { background: #444; color: #fff; }
    .history-status { color: #888; font-size: 0.85rem; }
    .history-status.success { color: #4CAF50; }

    /* Recommendations */
    .recommendations-section { margin-bottom: 2rem; padding: 1.5rem; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 12px; }
    .recommendations-section h2 { color: #e50914; margin-bottom: 0.5rem; font-size: 1.5rem; }
    .recommendations-subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
    .recommendations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .recommendations-grid .movie-card { background: #252535; }
    .movie-affinity { color: #FF1493; font-size: 0.7rem; font-weight: 600; display: block; margin-top: 0.25rem; }

    /* AI Diagnosis Button */
    .ai-diagnosis-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      border: none;
      transition: all 0.2s;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .ai-diagnosis-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    /* Google Login Button */
    .google-login-btn {
      background: #fff;
      color: #333;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      border: none;
      transition: all 0.2s;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .google-login-btn:hover {
      background: #f5f5f5;
    }
    .google-login-btn img {
      width: 18px;
      height: 18px;
    }

    /* User Profile */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .user-profile:hover {
      background: rgba(255,255,255,0.1);
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
    }
    .user-name {
      font-size: 0.85rem;
      color: #fff;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      min-width: 150px;
      z-index: 200;
    }
    .user-dropdown.active { display: block; }
    .user-dropdown-item {
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: #ccc;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-dropdown-item:hover {
      background: #333;
      color: #fff;
    }
    .user-dropdown-item:first-child { border-radius: 8px 8px 0 0; }
    .user-dropdown-item:last-child { border-radius: 0 0 8px 8px; }
    .user-menu-container { position: relative; }

    /* Onboarding Modal */
    .onboarding-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 300;
      justify-content: center;
      align-items: center;
    }
    .onboarding-overlay.active { display: flex; }
    .onboarding-modal {
      background: #1a1a1a;
      border-radius: 16px;
      max-width: 500px;
      width: 95%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .onboarding-header {
      padding: 1.5rem;
      border-bottom: 1px solid #333;
    }
    .onboarding-header h2 {
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .onboarding-header p {
      font-size: 0.85rem;
      color: #888;
    }
    .onboarding-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .onboarding-message {
      padding: 1rem;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
    }
    .onboarding-message.assistant {
      background: #252525;
      color: #e0e0e0;
      align-self: flex-start;
    }
    .onboarding-message.user {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      align-self: flex-end;
    }
    .onboarding-input-area {
      padding: 1rem;
      border-top: 1px solid #333;
      display: flex;
      gap: 0.75rem;
    }
    .onboarding-input-area input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      background: #252525;
      color: #fff;
      font-size: 1rem;
    }
    .onboarding-input-area input::placeholder { color: #666; }
    .onboarding-send-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .onboarding-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .onboarding-complete-btn {
      background: #4CAF50;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 1rem;
      width: 100%;
    }
    .onboarding-complete-btn:hover { background: #45a049; }
    .onboarding-typing {
      display: flex;
      gap: 5px;
      padding: 1rem;
      background: #252525;
      border-radius: 12px;
      max-width: 80px;
      align-self: flex-start;
    }
    .onboarding-typing span {
      width: 8px;
      height: 8px;
      background: #444;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .onboarding-typing span:nth-child(1) { animation-delay: -0.32s; }
    .onboarding-typing span:nth-child(2) { animation-delay: -0.16s; }

    /* Personalized Badge */
    .personalized-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    /* Language Toggle Button */
    .lang-toggle {
      background: #333;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid #555;
      transition: all 0.2s;
      font-weight: 500;
    }
    .lang-toggle:hover {
      background: #444;
      border-color: #777;
    }


    /* Mobile Responsive */
    @media (max-width: 768px) {
      header { padding: 0.75rem 1rem; }
      .logo { font-size: 1.5rem; }
      .search-bar { margin-top: 0.75rem; gap: 0.5rem; }
      .search-bar input { padding: 0.6rem 0.75rem; font-size: 0.9rem; min-width: 0; }
      .genre-tags { margin-top: 0.75rem; gap: 0.4rem; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
      .genre-tag-btn { padding: 0.3rem 0.6rem; font-size: 0.75rem; white-space: nowrap; flex-shrink: 0; }
      .personalization-controls { flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
      .upload-btn { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
      .clear-btn { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
      .history-status { font-size: 0.75rem; width: 100%; }

      main { padding: 1rem; }
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
      .movie-info { padding: 0.5rem; }
      .movie-title { font-size: 0.8rem; }
      .movie-meta { font-size: 0.65rem; }
      .movie-similarity { font-size: 0.6rem; }

      .recommendations-section { padding: 1rem; margin-bottom: 1rem; }
      .recommendations-section h2 { font-size: 1.2rem; }
      .recommendations-subtitle { font-size: 0.8rem; }
      .recommendations-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; }

      .modal-overlay { padding: 0; }
      .modal { border-radius: 0; max-height: 100vh; }
      .modal-header { height: 200px; }
      .modal-body { padding: 1rem; }
      .modal-title { font-size: 1.3rem; }
      .modal-title-ja { font-size: 0.85rem; }
      .modal-tagline { font-size: 0.95rem; }
      .modal-meta { flex-wrap: wrap; gap: 0.5rem 1rem; font-size: 0.8rem; }
      .modal-overview { font-size: 0.9rem; margin-bottom: 1.5rem; }
      .genre-tag { padding: 0.2rem 0.5rem; font-size: 0.7rem; }

      .extended-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
      .extended-item { padding: 0.75rem; }
      .extended-label { font-size: 0.65rem; }
      .extended-value { font-size: 0.85rem; }

      .provider-item { padding: 0.4rem 0.5rem; }
      .provider-logo { width: 24px; height: 24px; }
      .provider-name { font-size: 0.75rem; }

      .video-item { width: 200px; }
      .video-name { font-size: 0.75rem; }
      .video-type-badge { font-size: 0.6rem; }
      .video-modal-close { top: -35px; font-size: 1.5rem; }

      .cast-item { width: 80px; }
      .cast-photo { width: 60px; height: 60px; }
      .cast-name { font-size: 0.7rem; }
      .cast-character { font-size: 0.6rem; }

      .crew-item { padding: 0.5rem 0.75rem; }
      .crew-job { font-size: 0.6rem; }
      .crew-name { font-size: 0.8rem; }

      .review-item { padding: 0.75rem; }
      .review-author { font-size: 0.9rem; }
      .review-rating { font-size: 0.8rem; }
      .review-content { font-size: 0.8rem; }

      .similar-movie { width: 100px; }
      .similar-movie p { font-size: 0.65rem; }

      .providers-section h3, .videos-section h3, .cast-section h3, .crew-section h3, .reviews-section h3, .tmdb-similar-section h3, .similar-section h3, .extended-section h3 { font-size: 1rem; }

      .ai-diagnosis-btn { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
      .lang-toggle { padding: 0.4rem 0.75rem; font-size: 0.75rem; }
    }

    @media (max-width: 400px) {
      .movie-grid { grid-template-columns: repeat(2, 1fr); }
      .recommendations-grid { grid-template-columns: repeat(2, 1fr); }
      .extended-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">OTTflix</a>
    <div class="search-bar">
      <input type="text" id="search" placeholder="どんな映画が見たいですか？ (例: 宇宙を舞台にした感動作)">
    </div>
    <div class="genre-tags" id="genre-tags"></div>
    <div class="personalization-controls">
      <button class="lang-toggle" id="lang-toggle" onclick="toggleLang()">EN</button>
      <a href="/chat.html" class="ai-diagnosis-btn">AI診断</a>
      <label class="upload-btn">
        <input type="file" id="csv-upload" accept=".csv" hidden>
        Netflix履歴をアップロード
      </label>
      <button id="clear-history" class="clear-btn" style="display:none">履歴クリア</button>
      <span id="history-status" class="history-status"></span>

      <!-- Authentication -->
      <div id="auth-container">
        <button class="google-login-btn" id="login-btn" onclick="loginWithGoogle()">
          <img src="https://www.google.com/favicon.ico" alt="G">
          <span>ログイン</span>
        </button>
        <div class="user-menu-container" id="user-menu" style="display:none">
          <div class="user-profile" onclick="toggleUserDropdown()">
            <img class="user-avatar" id="user-avatar" src="" alt="">
            <span class="user-name" id="user-name"></span>
          </div>
          <div class="user-dropdown" id="user-dropdown">
            <div class="user-dropdown-item" onclick="showOnboarding()">好みを設定</div>
            <div class="user-dropdown-item" onclick="logout()">ログアウト</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="recommendations-section" id="recommendations" style="display:none">
      <h2>あなたへのおすすめ</h2>
      <p class="recommendations-subtitle">視聴履歴に基づく、まだ見ていない映画</p>
      <div class="recommendations-grid" id="recommendations-grid"></div>
    </section>
    <div class="stats" id="stats"></div>
    <div class="movie-grid" id="movies"></div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <img class="modal-backdrop" id="modal-backdrop" src="" alt="">
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <h1 class="modal-title" id="modal-title"></h1>
        <p class="modal-title-ja" id="modal-title-ja"></p>
        <p class="modal-tagline" id="modal-tagline"></p>
        <div class="modal-genres" id="modal-genres"></div>
        <div class="modal-meta" id="modal-meta"></div>
        <p class="modal-overview" id="modal-overview"></p>
        <div class="extended-section" id="extended-section"><h3>詳細情報</h3><div class="extended-grid" id="extended-content"></div></div>
        <div class="providers-section" id="providers-section"><h3>どこで見れる</h3><div id="providers-content"></div></div>
        <div class="videos-section" id="videos-section"><h3>予告編</h3><div class="video-list" id="videos-content"></div></div>
        <div class="cast-section" id="cast-section"><h3>キャスト</h3><div class="cast-list" id="cast-content"></div></div>
        <div class="crew-section" id="crew-section"><h3>スタッフ</h3><div class="crew-list" id="crew-content"></div></div>
        <div class="reviews-section" id="reviews-section"><h3>レビュー</h3><div class="review-list" id="reviews-content"></div></div>
        <div class="tmdb-similar-section" id="tmdb-similar-section"><h3>関連作品 (TMDb)</h3><div class="similar-movies" id="tmdb-similar-content"></div></div>
        <div class="similar-section"><h3>似ている映画 (AI類似)</h3><div class="similar-movies" id="similar-movies"></div></div>
      </div>
    </div>
  </div>

  <div class="video-modal-overlay" id="video-modal">
    <div class="video-modal">
      <button class="video-modal-close" onclick="closeVideoModal()">&times;</button>
      <iframe id="video-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Onboarding Modal -->
  <div class="onboarding-overlay" id="onboarding-modal">
    <div class="onboarding-modal">
      <div class="onboarding-header">
        <h2>あなたの映画の好みを教えてください</h2>
        <p>AIがあなたにぴったりの映画をおすすめするために、いくつか質問します</p>
      </div>
      <div class="onboarding-messages" id="onboarding-messages"></div>
      <div class="onboarding-input-area">
        <input type="text" id="onboarding-input" placeholder="回答を入力..." onkeypress="handleOnboardingKeypress(event)">
        <button class="onboarding-send-btn" id="onboarding-send-btn" onclick="sendOnboardingMessage()">送信</button>
      </div>
    </div>
  </div>


  <script>
    const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
    const TMDB_LOGO_BASE = 'https://image.tmdb.org/t/p/w92';
    const TMDB_PROFILE_BASE = 'https://image.tmdb.org/t/p/w185';
    let currentSearch = '';
    let currentGenre = '';

    // Language switching
    let currentLang = localStorage.getItem('ottflix-lang') || 'ja';

    // Translations
    const translations = {
      ja: {
        trailers: '予告編',
        whereToWatch: 'どこで見れる',
        cast: 'キャスト',
        crew: 'スタッフ',
        reviews: 'レビュー',
        relatedMovies: '関連作品 (TMDb)',
        similarMovies: '似ている映画 (AI類似)',
        detailedInfo: '詳細情報',
        flatrate: '定額配信',
        rent: 'レンタル',
        buy: '購入',
        noProviders: '配信情報はありません',
        noSimilar: '類似映画が見つかりません',
        release: '公開',
        runtime: '上映時間',
        rating: '評価',
        unknown: '不明',
        noOverview: '概要なし',
        budget: '製作費',
        revenue: '興行収入',
        viewOnImdb: 'IMDbで見る',
        readMore: '続きを読む',
        close: '閉じる',
        yourMatch: 'あなた好み度',
        similarity: '類似度',
        loading: '読み込み中...',
        popularMovies: '人気の映画',
        aiDiagnosis: 'AI診断',
        uploadHistory: 'Netflix履歴をアップロード',
        clearHistory: '履歴クリア',
        uploading: 'アップロード中...',
        uploadFailed: 'アップロード失敗',
        error: 'エラー',
        matched: '件マッチ',
        recommendationsTitle: 'あなたへのおすすめ',
        recommendationsSubtitle: '視聴履歴に基づく、まだ見ていない映画',
        searchPlaceholder: 'どんな映画が見たいですか？ (例: 宇宙を舞台にした感動作)',
        relatedTo: 'に関連する映画'
      },
      en: {
        trailers: 'Trailers',
        whereToWatch: 'Where to Watch',
        cast: 'Cast',
        crew: 'Crew',
        reviews: 'Reviews',
        relatedMovies: 'Related Movies (TMDb)',
        similarMovies: 'Similar Movies (AI)',
        detailedInfo: 'Details',
        flatrate: 'Streaming',
        rent: 'Rent',
        buy: 'Buy',
        noProviders: 'No streaming info available',
        noSimilar: 'No similar movies found',
        release: 'Release',
        runtime: 'Runtime',
        rating: 'Rating',
        unknown: 'Unknown',
        noOverview: 'No overview available',
        budget: 'Budget',
        revenue: 'Revenue',
        viewOnImdb: 'View on IMDb',
        readMore: 'Read more',
        close: 'Close',
        yourMatch: 'Match',
        similarity: 'Similarity',
        loading: 'Loading...',
        popularMovies: 'Popular Movies',
        aiDiagnosis: 'AI Diagnosis',
        uploadHistory: 'Upload Netflix History',
        clearHistory: 'Clear History',
        uploading: 'Uploading...',
        uploadFailed: 'Upload failed',
        error: 'Error',
        matched: ' matched',
        recommendationsTitle: 'Recommended for You',
        recommendationsSubtitle: 'Movies you haven\'t watched based on your history',
        searchPlaceholder: 'What movie do you want to watch? (e.g., emotional space adventure)',
        relatedTo: ' related movies'
      }
    };

    function t(key) {
      return translations[currentLang][key] || translations.ja[key] || key;
    }

    function initLang() {
      const btn = document.getElementById('lang-toggle');
      btn.textContent = currentLang === 'ja' ? 'EN' : '日本語';
      updateUIText();
    }

    function updateUIText() {
      document.getElementById('search').placeholder = t('searchPlaceholder');
      const aiBtn = document.querySelector('.ai-diagnosis-btn');
      if (aiBtn) aiBtn.textContent = t('aiDiagnosis');
      document.querySelector('.upload-btn').innerHTML = '<input type="file" id="csv-upload" accept=".csv" hidden>' + t('uploadHistory');
      document.getElementById('clear-history').textContent = t('clearHistory');
      document.querySelector('.recommendations-section h2').textContent = t('recommendationsTitle');
      document.querySelector('.recommendations-subtitle').textContent = t('recommendationsSubtitle');

      // Re-attach file input listener
      document.getElementById('csv-upload').addEventListener('change', handleFileUpload);
    }

    function toggleLang() {
      currentLang = currentLang === 'ja' ? 'en' : 'ja';
      localStorage.setItem('ottflix-lang', currentLang);
      const btn = document.getElementById('lang-toggle');
      btn.textContent = currentLang === 'ja' ? 'EN' : '日本語';
      updateUIText();
      loadMovies();
      loadRecommendations();
    }

    // ============================================
    // Supabase Authentication
    // ============================================

    let supabaseClient = null;
    let currentUser = null;
    let authToken = null;

    // Initialize Supabase client with config from server
    async function initSupabase() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.supabaseUrl && config.supabaseAnonKey) {
          supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

          // Listen for auth state changes
          supabaseClient.auth.onAuthStateChange(async (event, session) => {
            console.log('Auth state changed:', event);
            if (event === 'SIGNED_IN' && session) {
              authToken = session.access_token;
              await checkAuth();
              loadMovies();
            } else if (event === 'SIGNED_OUT') {
              authToken = null;
              currentUser = null;
              updateAuthUI();
              loadMovies();
            }
          });

          // Check initial auth state
          await checkAuth();
        } else {
          console.warn('Supabase not configured. Auth disabled.');
          document.getElementById('login-btn').style.display = 'none';
        }
      } catch (e) {
        console.error('Failed to init Supabase:', e);
      }
    }

    function getAuthHeaders() {
      return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
    }

    async function loginWithGoogle() {
      if (!supabaseClient) {
        console.error('Supabase not initialized');
        return;
      }
      const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) {
        console.error('Login error:', error);
      }
    }

    async function checkAuth() {
      if (!supabaseClient) {
        updateAuthUI();
        return;
      }

      // Get current session from Supabase
      const { data: { session }, error } = await supabaseClient.auth.getSession();

      if (error) {
        console.error('Session error:', error);
        updateAuthUI();
        return;
      }

      if (session) {
        authToken = session.access_token;

        // Get user from our backend (creates local user if needed)
        try {
          const res = await fetch('/api/auth/me', {
            headers: getAuthHeaders()
          });

          if (res.ok) {
            currentUser = await res.json();
            updateAuthUI();

            // Show onboarding for new users
            if (!currentUser.onboarding_completed) {
              showOnboarding();
            }
          } else {
            await logout();
          }
        } catch (e) {
          console.error('Auth check failed:', e);
        }
      } else {
        updateAuthUI();
      }
    }

    function updateAuthUI() {
      const loginBtn = document.getElementById('login-btn');
      const userMenu = document.getElementById('user-menu');

      if (currentUser) {
        loginBtn.style.display = 'none';
        userMenu.style.display = 'block';
        document.getElementById('user-avatar').src = currentUser.picture || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23333" width="100" height="100"/></svg>';
        document.getElementById('user-name').textContent = currentUser.name || currentUser.email.split('@')[0];
      } else {
        loginBtn.style.display = 'flex';
        userMenu.style.display = 'none';
      }
    }

    function toggleUserDropdown() {
      const dropdown = document.getElementById('user-dropdown');
      dropdown.classList.toggle('active');
    }

    async function logout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      authToken = null;
      currentUser = null;
      updateAuthUI();
      loadMovies();
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('user-dropdown');
      const userMenu = document.getElementById('user-menu');
      if (!userMenu.contains(e.target)) {
        dropdown.classList.remove('active');
      }
    });

    // ============================================
    // Onboarding
    // ============================================

    let onboardingMessages = [];
    let isOnboardingSending = false;
    let isOnboardingComplete = false;

    async function showOnboarding() {
      document.getElementById('user-dropdown').classList.remove('active');
      const modal = document.getElementById('onboarding-modal');
      modal.classList.add('active');

      // Load existing session
      try {
        const res = await fetch('/api/onboarding', {
          headers: getAuthHeaders()
        });
        const data = await res.json();
        onboardingMessages = data.messages || [];
        isOnboardingComplete = data.isComplete;
        renderOnboardingMessages();
      } catch (e) {
        console.error('Failed to load onboarding:', e);
      }
    }

    function hideOnboarding() {
      document.getElementById('onboarding-modal').classList.remove('active');
    }

    function renderOnboardingMessages() {
      const container = document.getElementById('onboarding-messages');
      container.innerHTML = onboardingMessages.map(m =>
        '<div class="onboarding-message ' + m.role + '">' + escapeHtml(m.content) + '</div>'
      ).join('');

      if (isOnboardingComplete) {
        container.innerHTML += '<button class="onboarding-complete-btn" onclick="completeOnboarding()">設定を完了する</button>';
      }

      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addOnboardingTyping() {
      const container = document.getElementById('onboarding-messages');
      container.innerHTML += '<div class="onboarding-typing" id="onboarding-typing"><span></span><span></span><span></span></div>';
      container.scrollTop = container.scrollHeight;
    }

    function removeOnboardingTyping() {
      const typing = document.getElementById('onboarding-typing');
      if (typing) typing.remove();
    }

    async function sendOnboardingMessage() {
      if (isOnboardingSending) return;

      const input = document.getElementById('onboarding-input');
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      onboardingMessages.push({ role: 'user', content: message });
      renderOnboardingMessages();

      isOnboardingSending = true;
      document.getElementById('onboarding-send-btn').disabled = true;
      addOnboardingTyping();

      try {
        const res = await fetch('/api/onboarding/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...getAuthHeaders()
          },
          body: JSON.stringify({ message })
        });

        removeOnboardingTyping();

        if (res.ok) {
          const data = await res.json();
          onboardingMessages.push({ role: 'assistant', content: data.message });
          isOnboardingComplete = data.isComplete;
          renderOnboardingMessages();
        }
      } catch (e) {
        removeOnboardingTyping();
        console.error('Onboarding chat error:', e);
      } finally {
        isOnboardingSending = false;
        document.getElementById('onboarding-send-btn').disabled = false;
        input.focus();
      }
    }

    function handleOnboardingKeypress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendOnboardingMessage();
      }
    }

    async function completeOnboarding() {
      try {
        const res = await fetch('/api/onboarding/complete', {
          method: 'POST',
          headers: getAuthHeaders()
        });

        if (res.ok) {
          hideOnboarding();
          currentUser.onboarding_completed = true;
          currentUser.has_preference = true;
          loadMovies(); // Reload with personalized results
        }
      } catch (e) {
        console.error('Failed to complete onboarding:', e);
      }
    }

    // Close onboarding when clicking outside
    document.getElementById('onboarding-modal').addEventListener('click', (e) => {
      if (e.target.id === 'onboarding-modal') {
        hideOnboarding();
      }
    });

    // ============================================
    // Interaction Tracking
    // ============================================

    function trackInteraction(type, movieId, queryText) {
      if (!currentUser) return;

      fetch('/api/interactions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...getAuthHeaders()
        },
        body: JSON.stringify({ type, movieId, queryText })
      }).catch(e => console.error('Track interaction failed:', e));
    }

    function getTitle(movie) {
      if (currentLang === 'ja') {
        return movie.title_ja || movie.title;
      }
      return movie.title || movie.title_ja;
    }

    function getOverview(movie) {
      if (currentLang === 'ja') {
        return movie.overview_ja || movie.overview || '';
      }
      return movie.overview || movie.overview_ja || '';
    }

    function getPoster(movie) {
      if (currentLang === 'en' && movie.poster_path_en) {
        return TMDB_IMAGE_BASE + movie.poster_path_en;
      }
      if (movie.poster_path) {
        return TMDB_IMAGE_BASE + movie.poster_path;
      }
      return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect fill="%23333" width="200" height="300"/></svg>';
    }

    async function loadGenres() {
      const res = await fetch('/api/genres');
      const genres = await res.json();
      const container = document.getElementById('genre-tags');
      container.innerHTML = genres.map(g => '<button class="genre-tag-btn" data-genre="' + g + '">' + g + '</button>').join('');
      container.addEventListener('click', (e) => {
        if (e.target.classList.contains('genre-tag-btn')) {
          const genre = e.target.dataset.genre;
          if (currentGenre === genre) {
            currentGenre = '';
            e.target.classList.remove('active');
          } else {
            document.querySelectorAll('.genre-tag-btn').forEach(btn => btn.classList.remove('active'));
            currentGenre = genre;
            e.target.classList.add('active');
          }
          currentSearch = '';
          document.getElementById('search').value = '';
          loadMovies();
        }
      });
    }

    function getSessionId() {
      let id = localStorage.getItem('ottflix-session');
      if (!id) {
        id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        localStorage.setItem('ottflix-session', id);
      }
      return id;
    }

    async function loadRecommendations() {
      const sessionId = getSessionId();
      try {
        const res = await fetch('/api/recommendations/' + sessionId + '?limit=20');
        if (!res.ok) {
          document.getElementById('recommendations').style.display = 'none';
          document.getElementById('clear-history').style.display = 'none';
          return;
        }
        const data = await res.json();
        if (!data.recommendations || data.recommendations.length === 0) {
          document.getElementById('recommendations').style.display = 'none';
          return;
        }
        document.getElementById('recommendations').style.display = 'block';
        document.getElementById('clear-history').style.display = 'inline-block';
        renderRecommendations(data.recommendations);
      } catch (e) {
        document.getElementById('recommendations').style.display = 'none';
      }
    }

    function renderRecommendations(movies) {
      const grid = document.getElementById('recommendations-grid');
      grid.innerHTML = movies.map(m => {
        const poster = getPoster(m);
        const title = getTitle(m);
        return '<div class="movie-card" onclick="openModal(' + m.id + ')"><img class="movie-poster" src="' + poster + '" alt="' + escapeHtml(title) + '" loading="lazy"><div class="movie-info"><div class="movie-title">' + escapeHtml(title) + '</div><div class="movie-meta"><span class="movie-rating">★ ' + (m.vote_average?.toFixed(1) || '-') + '</span></div><span class="movie-affinity">' + t('yourMatch') + ': ' + m.affinity + '%</span></div></div>';
      }).join('');
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('history-status');
      statusEl.textContent = t('uploading');
      statusEl.classList.remove('success');
      const formData = new FormData();
      formData.append('file', file);
      formData.append('sessionId', getSessionId());
      try {
        const res = await fetch('/api/history/upload', { method: 'POST', body: formData });
        const result = await res.json();
        if (result.success) {
          statusEl.textContent = result.matchedCount + '/' + result.totalEntries + t('matched');
          statusEl.classList.add('success');
          document.getElementById('clear-history').style.display = 'inline-block';
          loadRecommendations();
        } else {
          statusEl.textContent = t('uploadFailed');
        }
      } catch (err) {
        statusEl.textContent = t('error');
      }
      e.target.value = '';
    }

    document.getElementById('csv-upload').addEventListener('change', handleFileUpload);

    document.getElementById('clear-history').addEventListener('click', async () => {
      try {
        await fetch('/api/history/' + getSessionId(), { method: 'DELETE' });
        document.getElementById('recommendations').style.display = 'none';
        document.getElementById('clear-history').style.display = 'none';
        document.getElementById('history-status').textContent = '';
      } catch (e) {}
    });

    async function loadMovies() {
      const moviesEl = document.getElementById('movies');
      const statsEl = document.getElementById('stats');
      moviesEl.innerHTML = '<div class="loading">' + t('loading') + '</div>';

      if (currentSearch) {
        // AI検索 (with auth for personalization)
        const res = await fetch('/api/search?q=' + encodeURIComponent(currentSearch) + '&limit=40', {
          headers: getAuthHeaders()
        });
        const data = await res.json();
        if (data.error) {
          moviesEl.innerHTML = '<div class="loading">' + data.error + '</div>';
          return;
        }
        renderMovies(data.movies, true);
        const personalizedBadge = data.personalized ? '<span class="personalized-badge">パーソナライズ</span>' : '';
        statsEl.innerHTML = '"' + currentSearch + '"' + t('relatedTo') + ': ' + data.movies.length + personalizedBadge;
      } else {
        // 通常表示（ジャンルフィルター対応）
        const params = new URLSearchParams({ limit: '40' });
        if (currentGenre) params.set('genre', currentGenre);
        const res = await fetch('/api/movies?' + params);
        const data = await res.json();
        renderMovies(data.movies, false);
        statsEl.textContent = currentGenre ? currentGenre + ': ' + data.pagination.total : t('popularMovies') + ': ' + data.pagination.total;
      }
    }

    function renderMovies(movies, showSimilarity) {
      const grid = document.getElementById('movies');
      grid.innerHTML = movies.map(m => {
        const year = m.release_date ? m.release_date.split('-')[0] : '';
        const poster = getPoster(m);
        const sim = showSimilarity && m.distance !== undefined ? '<span class="movie-similarity">' + t('similarity') + ': ' + Math.round(100 / (1 + m.distance)) + '%</span>' : '';
        const title = getTitle(m);
        return '<div class="movie-card" onclick="openModal(' + m.id + ')"><img class="movie-poster" src="' + poster + '" alt="' + escapeHtml(title) + '" loading="lazy"><div class="movie-info"><div class="movie-title">' + escapeHtml(title) + '</div><div class="movie-meta"><span>' + year + '</span><span class="movie-rating">★ ' + (m.vote_average?.toFixed(1) || '-') + '</span></div>' + sim + '</div></div>';
      }).join('');
    }

    function renderProvider(p) {
      const logo = p.logo_path ? TMDB_LOGO_BASE + p.logo_path : '';
      return '<div class="provider-item">' + (logo ? '<img class="provider-logo" src="' + logo + '" alt="' + p.provider_name + '">' : '') + '<span class="provider-name">' + p.provider_name + '</span></div>';
    }

    function formatCurrency(a) {
      if (!a || a === 0) return '-';
      if (a >= 1e9) return '$' + (a/1e9).toFixed(1) + 'B';
      if (a >= 1e6) return '$' + (a/1e6).toFixed(1) + 'M';
      return '$' + a.toLocaleString();
    }

    function openVideoModal(k) {
      document.getElementById('video-iframe').src = 'https://www.youtube.com/embed/' + k + '?autoplay=1';
      document.getElementById('video-modal').classList.add('active');
    }

    function closeVideoModal() {
      document.getElementById('video-iframe').src = '';
      document.getElementById('video-modal').classList.remove('active');
    }

    function toggleReview(btn) {
      const c = btn.previousElementSibling;
      c.classList.toggle('expanded');
      btn.textContent = c.classList.contains('expanded') ? t('close') : t('readMore');
    }

    async function openModal(id) {
      // Track view interaction
      trackInteraction('view', id);

      const [fullRes, similarRes] = await Promise.all([fetch('/api/movies/' + id + '/full'), fetch('/api/movies/' + id + '/similar?limit=6')]);
      const m = await fullRes.json();
      const similarData = await similarRes.json();
      const genres = m.genres ? JSON.parse(m.genres) : [];
      const backdrop = getPoster(m);

      document.getElementById('modal-backdrop').src = backdrop;
      const mainTitle = currentLang === 'ja' ? (m.title_ja || m.title) : (m.title || m.title_ja);
      document.getElementById('modal-title').textContent = mainTitle;
      // In English mode, hide the Japanese subtitle
      const subTitleEl = document.getElementById('modal-title-ja');
      if (currentLang === 'ja' && m.title) {
        subTitleEl.textContent = m.title;
        subTitleEl.style.display = 'block';
      } else {
        subTitleEl.textContent = '';
        subTitleEl.style.display = 'none';
      }

      const taglineEl = document.getElementById('modal-tagline');
      if (m.extended?.tagline_ja || m.extended?.tagline) {
        // Show English tagline if in English mode, Japanese otherwise
        const tagline = currentLang === 'en' ? (m.extended.tagline || m.extended.tagline_ja) : (m.extended.tagline_ja || m.extended.tagline);
        taglineEl.textContent = '"' + tagline + '"';
        taglineEl.style.display = 'block';
      } else { taglineEl.style.display = 'none'; }

      document.getElementById('modal-genres').innerHTML = genres.map(g => '<span class="genre-tag">' + g + '</span>').join('');
      const runtimeText = m.runtime ? m.runtime + (currentLang === 'ja' ? '分' : ' min') : t('unknown');
      document.getElementById('modal-meta').innerHTML = '<span>' + t('release') + ': ' + (m.release_date || t('unknown')) + '</span><span>' + t('runtime') + ': ' + runtimeText + '</span><span>' + t('rating') + ': ★ ' + (m.vote_average?.toFixed(1) || '-') + '</span>';
      const overview = getOverview(m);
      document.getElementById('modal-overview').textContent = overview || t('noOverview');

      const extSec = document.getElementById('extended-section');
      const extCon = document.getElementById('extended-content');
      extSec.querySelector('h3').textContent = t('detailedInfo');
      if (m.extended) {
        let h = '';
        if (m.extended.budget > 0) h += '<div class="extended-item"><div class="extended-label">' + t('budget') + '</div><div class="extended-value">' + formatCurrency(m.extended.budget) + '</div></div>';
        if (m.extended.revenue > 0) h += '<div class="extended-item"><div class="extended-label">' + t('revenue') + '</div><div class="extended-value">' + formatCurrency(m.extended.revenue) + '</div></div>';
        if (m.extended.imdb_id) h += '<div class="extended-item"><div class="extended-label">IMDb</div><div class="extended-value"><a href="https://www.imdb.com/title/' + m.extended.imdb_id + '" target="_blank">' + t('viewOnImdb') + '</a></div></div>';
        if (h) { extCon.innerHTML = h; extSec.style.display = 'block'; } else { extSec.style.display = 'none'; }
      } else { extSec.style.display = 'none'; }

      const wp = m.watchProviders || { flatrate: [], rent: [], buy: [] };
      const provCon = document.getElementById('providers-content');
      document.getElementById('providers-section').querySelector('h3').textContent = t('whereToWatch');
      if (wp.flatrate.length === 0 && wp.rent.length === 0 && wp.buy.length === 0) {
        provCon.innerHTML = '<p class="no-providers">' + t('noProviders') + '</p>';
      } else {
        let h = '';
        if (wp.flatrate.length > 0) h += '<div class="provider-group"><div class="provider-group-title">' + t('flatrate') + '</div><div class="provider-list">' + wp.flatrate.map(renderProvider).join('') + '</div></div>';
        if (wp.rent.length > 0) h += '<div class="provider-group"><div class="provider-group-title">' + t('rent') + '</div><div class="provider-list">' + wp.rent.map(renderProvider).join('') + '</div></div>';
        if (wp.buy.length > 0) h += '<div class="provider-group"><div class="provider-group-title">' + t('buy') + '</div><div class="provider-list">' + wp.buy.map(renderProvider).join('') + '</div></div>';
        provCon.innerHTML = h;
      }

      const videos = m.videos || [];
      const vidSec = document.getElementById('videos-section');
      const vidCon = document.getElementById('videos-content');
      vidSec.querySelector('h3').textContent = t('trailers');
      if (videos.length > 0) {
        vidCon.innerHTML = videos.map(v => {
          // Use English video if available and language is English
          const videoKey = (currentLang === 'en' && v.video_key_en) ? v.video_key_en : v.video_key;
          const videoName = (currentLang === 'en' && v.name_en) ? v.name_en : v.name;
          return '<div class="video-item" onclick="openVideoModal(\'' + videoKey + '\')"><img class="video-thumbnail" src="https://img.youtube.com/vi/' + videoKey + '/mqdefault.jpg" alt=""><p class="video-name">' + videoName + '</p><span class="video-type-badge">' + v.video_type + '</span></div>';
        }).join('');
        vidSec.style.display = 'block';
      } else { vidSec.style.display = 'none'; }

      const cast = m.credits?.cast || [];
      const castSec = document.getElementById('cast-section');
      const castCon = document.getElementById('cast-content');
      castSec.querySelector('h3').textContent = t('cast');
      if (cast.length > 0) {
        castCon.innerHTML = cast.map(c => {
          const photo = c.profile_path ? TMDB_PROFILE_BASE + c.profile_path : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23333" width="100" height="100"/></svg>';
          const displayName = (currentLang === 'en' && c.name_en) ? c.name_en : c.name;
          return '<div class="cast-item"><img class="cast-photo" src="' + photo + '" alt="' + escapeHtml(displayName) + '" loading="lazy"><p class="cast-name">' + escapeHtml(displayName) + '</p><p class="cast-character">' + escapeHtml(c.character || '') + '</p></div>';
        }).join('');
        castSec.style.display = 'block';
      } else { castSec.style.display = 'none'; }

      const crew = m.credits?.crew || [];
      const crewSec = document.getElementById('crew-section');
      const crewCon = document.getElementById('crew-content');
      crewSec.querySelector('h3').textContent = t('crew');
      if (crew.length > 0) {
        crewCon.innerHTML = crew.map(c => {
          const displayName = (currentLang === 'en' && c.name_en) ? c.name_en : c.name;
          return '<div class="crew-item"><div class="crew-job">' + escapeHtml(c.job) + '</div><div class="crew-name">' + escapeHtml(displayName) + '</div></div>';
        }).join('');
        crewSec.style.display = 'block';
      } else { crewSec.style.display = 'none'; }

      const reviews = m.reviews || [];
      const revSec = document.getElementById('reviews-section');
      const revCon = document.getElementById('reviews-content');
      revSec.querySelector('h3').textContent = t('reviews');
      if (reviews.length > 0) {
        revCon.innerHTML = reviews.map(r => '<div class="review-item"><div class="review-header"><span class="review-author">' + r.author + '</span>' + (r.rating ? '<span class="review-rating">★ ' + r.rating + '</span>' : '') + '</div><p class="review-content">' + r.content + '</p>' + (r.content.length > 200 ? '<button class="review-toggle" onclick="toggleReview(this)">' + t('readMore') + '</button>' : '') + '</div>').join('');
        revSec.style.display = 'block';
      } else { revSec.style.display = 'none'; }

      const tmdbSimilar = m.tmdbSimilar || [];
      const tmdbSec = document.getElementById('tmdb-similar-section');
      const tmdbCon = document.getElementById('tmdb-similar-content');
      tmdbSec.querySelector('h3').textContent = t('relatedMovies');
      if (tmdbSimilar.length > 0) {
        tmdbCon.innerHTML = tmdbSimilar.map(sm => {
          const p = getPoster(sm);
          const smTitle = getTitle(sm);
          return '<div class="similar-movie" onclick="openModal(' + sm.id + ')"><img src="' + p + '" alt="' + escapeHtml(smTitle) + '" loading="lazy"><p>' + escapeHtml(smTitle) + '</p></div>';
        }).join('');
        tmdbSec.style.display = 'block';
      } else { tmdbSec.style.display = 'none'; }

      const similarMovies = similarData.movies || [];
      document.querySelector('.similar-section h3').textContent = t('similarMovies');
      document.getElementById('similar-movies').innerHTML = similarMovies.map(sm => {
        const p = getPoster(sm);
        const smTitle = getTitle(sm);
        return '<div class="similar-movie" onclick="openModal(' + sm.id + ')"><img src="' + p + '" alt="' + escapeHtml(smTitle) + '" loading="lazy"><p>' + escapeHtml(smTitle) + '</p></div>';
      }).join('') || '<p style="color:#888">' + t('noSimilar') + '</p>';

      document.getElementById('modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.getElementById('video-modal').addEventListener('click', (e) => { if (e.target.id === 'video-modal') closeVideoModal(); });

    let searchTimeout;
    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentSearch = e.target.value;
        if (currentSearch) {
          currentGenre = '';
          document.querySelectorAll('.genre-tag-btn').forEach(btn => btn.classList.remove('active'));
        }
        loadMovies();
      }, 500);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('video-modal').classList.contains('active')) closeVideoModal();
        else closeModal();
      }
    });

    initLang();
    loadGenres();
    loadMovies();
    loadRecommendations();
    initSupabase();

    // Check if we need to open a movie from chat page
    const movieToOpen = sessionStorage.getItem('ottflix-open-movie');
    if (movieToOpen) {
      sessionStorage.removeItem('ottflix-open-movie');
      openModal(parseInt(movieToOpen));
    }
  </script>
</body>
</html>
