  <script>
    const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
    let chatMessages = [];
    let isSending = false;
    let currentThreadId = null;
    let threads = [];
    let currentUser = null;

    // Language detection (same as index.html)
    function detectBrowserLanguage() {
      const stored = localStorage.getItem('ottflix-lang');
      if (stored) return stored;
      const browserLang = navigator.language || navigator.languages?.[0] || 'ja';
      const detectedLang = browserLang.startsWith('en') ? 'en' : 'ja';
      localStorage.setItem('ottflix-lang', detectedLang);
      return detectedLang;
    }
    const currentLang = detectBrowserLanguage();

    // ============================================
    // Sidebar Functions
    // ============================================
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    }

    // ============================================
    // Recommendations Sidebar Functions
    // ============================================
    let allRecommendations = []; // Store all recommendations from the session

    function toggleRecommendationsSidebar() {
      document.getElementById('recommendations-sidebar').classList.toggle('open');
      document.getElementById('recommendations-overlay').classList.toggle('active');
    }

    function closeRecommendationsSidebar() {
      document.getElementById('recommendations-sidebar').classList.remove('open');
      document.getElementById('recommendations-overlay').classList.remove('active');
    }

    function addRecommendationsToSidebar(movies, userMessage = '') {
      if (!movies || movies.length === 0) return;

      // Add movies with timestamp and user message context
      const timestamp = new Date();
      movies.forEach(movie => {
        // Check if movie already exists in recommendations
        const existingIndex = allRecommendations.findIndex(r => r.id === movie.id);
        if (existingIndex === -1) {
          allRecommendations.unshift({
            ...movie,
            recommendedAt: timestamp,
            reason: userMessage
          });
        }
      });

      renderRecommendationsSidebar();
    }

    function renderRecommendationsSidebar() {
      const container = document.getElementById('recommendations-list');
      const footer = document.getElementById('recommendations-footer');
      const badge = document.getElementById('recommendations-badge');
      const countEl = document.getElementById('recommendations-count');

      if (allRecommendations.length === 0) {
        container.innerHTML = `<div class="recommendations-empty">
          ${currentLang === 'ja' ? '会話を始めると、おすすめの映画がここに表示されます' : 'Start a conversation to see movie recommendations here'}
        </div>`;
        footer.style.display = 'none';
        badge.style.display = 'none';
        return;
      }

      container.innerHTML = allRecommendations.map(movie => {
        const poster = movie.poster_path
          ? TMDB_IMAGE_BASE + movie.poster_path
          : 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 200 300%27%3E%3Crect fill=%27%23222%27 width=%27200%27 height=%27300%27/%3E%3Ctext x=%27100%27 y=%27150%27 text-anchor=%27middle%27 fill=%27%23555%27 font-size=%2740%27%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E';
        const title = getTitle(movie);
        const year = movie.release_date ? movie.release_date.split('-')[0] : '';
        const rating = movie.vote_average?.toFixed(1) || '-';
        const genres = movie.genres?.slice(0, 2).map(g => g.name || g).join('、') || '';
        const timeAgo = formatRecommendationTime(movie.recommendedAt);

        return `
          <div class="recommendation-item" onclick="showMovieDetail(${movie.id})">
            <div class="recommendation-poster">
              <img src="${poster}" alt="${escapeHtml(title)}" loading="lazy">
              <div class="recommendation-rating-badge">
                <span class="star">★</span>
                ${rating}
              </div>
            </div>
            <div class="recommendation-info">
              <div class="recommendation-title">${escapeHtml(title)}</div>
              <div class="recommendation-meta">${year}${genres ? ' • ' + genres : ''}</div>
              ${movie.reason ? `<div class="recommendation-reason">${escapeHtml(truncateReason(movie.reason))}</div>` : ''}
              <div class="recommendation-date">🕐 ${timeAgo}</div>
            </div>
            <span class="recommendation-arrow">›</span>
          </div>
        `;
      }).join('');

      footer.style.display = 'block';
      countEl.textContent = allRecommendations.length;
      badge.textContent = allRecommendations.length;
      badge.style.display = 'flex';
    }

    function formatRecommendationTime(date) {
      const now = new Date();
      const diff = now - date;
      const minutes = Math.floor(diff / (1000 * 60));
      const hours = Math.floor(diff / (1000 * 60 * 60));

      if (minutes < 1) return currentLang === 'ja' ? 'たった今' : 'Just now';
      if (minutes < 60) return currentLang === 'ja' ? `${minutes}分前` : `${minutes}m ago`;
      if (hours < 24) return currentLang === 'ja' ? `${hours}時間前` : `${hours}h ago`;
      return formatDate(date);
    }

    function truncateReason(reason) {
      if (!reason) return '';
      // Extract a short meaningful reason from the user message
      const maxLen = 40;
      if (reason.length <= maxLen) return reason;
      return reason.slice(0, maxLen) + '...';
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));

      if (days === 0) return currentLang === 'ja' ? '今日' : 'Today';
      if (days === 1) return currentLang === 'ja' ? '昨日' : 'Yesterday';
      if (days < 7) return currentLang === 'ja' ? `${days}日前` : `${days} days ago`;
      return date.toLocaleDateString(currentLang === 'ja' ? 'ja-JP' : 'en-US', { month: 'short', day: 'numeric' });
    }

    function renderThreadList() {
      const container = document.getElementById('thread-list');
      const loginPrompt = document.getElementById('sidebar-login');

      if (!currentUser) {
        container.innerHTML = '';
        loginPrompt.style.display = 'block';
        if (currentLang === 'en') {
          loginPrompt.innerHTML = '<a href="/">Login</a> to save history';
        }
        return;
      }

      loginPrompt.style.display = 'none';

      if (threads.length === 0) {
        container.innerHTML = `<div style="padding: 1rem; text-align: center; color: #666; font-size: 0.85rem;">
          ${currentLang === 'ja' ? '履歴がありません' : 'No history'}
        </div>`;
        return;
      }

      container.innerHTML = threads.map(t => {
        const thumbnailsHtml = (t.thumbnails && t.thumbnails.length > 0)
          ? `<div class="thread-item-thumbnails">${t.thumbnails.map(p =>
              `<img class="thread-item-thumbnail" src="${TMDB_IMAGE_BASE}${p}" alt="" loading="lazy">`
            ).join('')}</div>`
          : '';
        return `
        <div class="thread-item ${t.id === currentThreadId ? 'active' : ''}" onclick="loadThread(${t.id})">
          <div class="thread-item-content">
            <div class="thread-item-title">${escapeHtml(t.title || 'New Chat')}</div>
            <div class="thread-item-date">${formatDate(t.updated_at)}</div>
            ${thumbnailsHtml}
          </div>
          <button class="thread-item-delete" onclick="event.stopPropagation(); deleteThread(${t.id})" title="${currentLang === 'ja' ? '削除' : 'Delete'}">×</button>
        </div>
      `;
      }).join('');
    }

    async function loadThreads() {
      if (!currentUser) {
        threads = [];
        renderThreadList();
        return;
      }

      try {
        const res = await fetch('/api/chat/threads', {
          headers: await getAuthHeaders()
        });
        if (res.ok) {
          const data = await res.json();
          threads = data.threads || [];
          renderThreadList();
        }
      } catch (e) {
        console.error('Failed to load threads:', e);
      }
    }

    async function loadThread(threadId) {
      if (!currentUser) return;

      try {
        const res = await fetch('/api/chat/threads/' + threadId, {
          headers: await getAuthHeaders()
        });
        if (res.ok) {
          const thread = await res.json();
          currentThreadId = thread.id;
          chatMessages = thread.messages || [];

          // Re-render messages
          const container = document.getElementById('chat-messages');
          container.innerHTML = '';

          // Reset and rebuild recommendations from thread
          allRecommendations = [];
          let lastUserMessage = '';
          chatMessages.forEach(msg => {
            addMessageToUI(msg.role, msg.content, msg.movies || [], msg.extendedInfo || null);

            // Track user messages for recommendation context
            if (msg.role === 'user') {
              lastUserMessage = msg.content;
            }
            // Add movies from assistant messages to recommendations
            if (msg.role === 'assistant' && msg.movies && msg.movies.length > 0) {
              msg.movies.forEach(movie => {
                const existingIndex = allRecommendations.findIndex(r => r.id === movie.id);
                if (existingIndex === -1) {
                  allRecommendations.push({
                    ...movie,
                    recommendedAt: new Date(thread.updated_at || Date.now()),
                    reason: lastUserMessage
                  });
                }
              });
            }
          });
          // Reverse to show newest first
          allRecommendations.reverse();
          renderRecommendationsSidebar();

          renderThreadList();
          closeSidebar();
        }
      } catch (e) {
        console.error('Failed to load thread:', e);
      }
    }

    async function saveThread() {
      if (chatMessages.length < 2) return;

      // Re-check authentication if currentUser is not set (handles race condition)
      if (!currentUser && clerkInstance && clerkInstance.session) {
        await checkUserAuth();
      }
      if (!currentUser) return;

      const title = chatMessages.find(m => m.role === 'user')?.content?.slice(0, 50) || 'New Chat';

      try {
        if (currentThreadId) {
          // Update existing thread
          const res = await fetch('/api/chat/threads/' + currentThreadId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', ...await getAuthHeaders() },
            body: JSON.stringify({ title, messages: chatMessages })
          });
          if (!res.ok) {
            console.error('Failed to update thread:', res.status, await res.text());
          }
        } else {
          // Create new thread
          const res = await fetch('/api/chat/threads', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...await getAuthHeaders() },
            body: JSON.stringify({ title, messages: chatMessages })
          });
          if (res.ok) {
            const data = await res.json();
            currentThreadId = data.id;
            console.log('Thread created:', currentThreadId);
          } else {
            console.error('Failed to create thread:', res.status, await res.text());
          }
        }
        await loadThreads();
      } catch (e) {
        console.error('Failed to save thread:', e);
      }
    }

    async function deleteThread(threadId) {
      if (!confirm(currentLang === 'ja' ? 'この会話を削除しますか？' : 'Delete this conversation?')) return;

      try {
        await fetch('/api/chat/threads/' + threadId, {
          method: 'DELETE',
          headers: await getAuthHeaders()
        });

        if (currentThreadId === threadId) {
          startNewChat();
        }
        await loadThreads();
      } catch (e) {
        console.error('Failed to delete thread:', e);
      }
    }

    function startNewChat() {
      currentThreadId = null;
      chatMessages = [];
      allRecommendations = [];
      document.getElementById('chat-messages').innerHTML = '';
      initChat();
      renderThreadList();
      renderRecommendationsSidebar();
      closeSidebar();
    }

    // ============================================
    // Clerk Authentication
    // ============================================
    let clerkInstance = null;
    let authToken = null;

    function waitForClerk() {
      return new Promise((resolve) => {
        if (window.Clerk) {
          resolve(window.Clerk);
        } else {
          const check = setInterval(() => {
            if (window.Clerk) {
              clearInterval(check);
              resolve(window.Clerk);
            }
          }, 100);
          setTimeout(() => {
            clearInterval(check);
            resolve(null);
          }, 10000);
        }
      });
    }

    async function initClerk() {
      try {
        const clerk = await waitForClerk();
        if (!clerk) {
          console.warn('Clerk failed to load');
          return;
        }

        await clerk.load();
        clerkInstance = clerk;

        if (clerkInstance.session) {
          authToken = await clerkInstance.session.getToken();
          console.log('Clerk: Logged in, token obtained');
        } else {
          console.log('Clerk: No active session');
        }

        clerkInstance.addListener(async () => {
          if (clerkInstance.session) {
            authToken = await clerkInstance.session.getToken();
            console.log('Clerk: Session updated, token refreshed');
            // Re-check user auth and reload threads when session is updated
            await checkUserAuth();
            await loadThreads();
          } else {
            authToken = null;
            currentUser = null;
            threads = [];
            renderThreadList();
            console.log('Clerk: Session ended');
          }
        });
      } catch (e) {
        console.error('Failed to init Clerk:', e);
      }
    }

    async function getAuthHeaders() {
      if (clerkInstance && clerkInstance.session) {
        try {
          authToken = await clerkInstance.session.getToken();
        } catch (e) {
          console.error('Failed to get token:', e);
          authToken = null;
        }
      }
      return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getTitle(movie) {
      if (currentLang === 'en') {
        return movie.title || movie.title_ja;
      }
      return movie.title_ja || movie.title;
    }

    // ============================================
    // Watched/Watchlist/Dismissed Features
    // ============================================

    let currentModalMovieId = null;
    let currentModalMovieTitle = null;

    // 自動メッセージ送信（モーダルのアクションに反応）
    async function sendAutoMessage(message) {
      if (isSending) return;

      addMessage('user', message);

      if (!currentThreadId && chatMessages.length >= 2) {
        await saveThread();
      }

      isSending = true;
      document.getElementById('send-btn').disabled = true;
      addMessageToUI('typing', '');

      try {
        const authHeaders = await getAuthHeaders();
        const apiMessages = chatMessages.map(m => ({ role: m.role, content: m.content }));

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders },
          body: JSON.stringify({ messages: apiMessages, lang: currentLang })
        });

        removeTypingIndicator();

        if (!response.ok) throw new Error('Request failed');

        const data = await response.json();
        const movies = data.recommendations || (data.recommendation ? [data.recommendation] : []);
        const extendedInfo = data.extendedInfo || null;
        addMessage('assistant', data.message, movies, extendedInfo);

        // Add recommendations to sidebar
        if (movies.length > 0) {
          addRecommendationsToSidebar(movies, message);
        }

        await saveThread();
      } catch (error) {
        removeTypingIndicator();
        const errorMsg = currentLang === 'ja'
          ? 'すみません、エラーが発生しました。'
          : 'Sorry, an error occurred.';
        addMessage('assistant', errorMsg);
        console.error('Auto message error:', error);
      } finally {
        isSending = false;
        document.getElementById('send-btn').disabled = false;
      }

      // スクロールを一番下に
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    async function setRating(rating) {
      if (!currentUser || !currentModalMovieId) {
        alert(currentLang === 'ja' ? 'ログインしてください' : 'Please login first');
        return;
      }

      const movieTitle = currentModalMovieTitle;

      try {
        const res = await fetch('/api/watched', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...await getAuthHeaders()
          },
          body: JSON.stringify({ movieId: currentModalMovieId, rating })
        });

        if (res.ok) {
          currentWatchedData = { rating };
          updateWatchedUI();

          // モーダルを閉じてAIにフィードバック
          MovieModal.closeModal();
          const ratingText = '★'.repeat(rating);
          const message = currentLang === 'ja'
            ? `「${movieTitle}」は見たよ！${ratingText}`
            : `I've watched "${movieTitle}"! ${ratingText}`;
          sendAutoMessage(message);
        } else if (res.status === 401) {
          currentUser = null;
          authToken = null;
          alert(currentLang === 'ja' ? 'ログインしてください' : 'Please login first');
        }
      } catch (e) {
        console.error('Failed to save watched:', e);
      }

    function updateWatchedUI() {
      const watchedBtn = document.getElementById('watched-btn');
      const watchedBtnIcon = document.getElementById('watched-btn-icon');
      const watchedBtnText = document.getElementById('watched-btn-text');
      const starRating = document.getElementById('star-rating');

      if (currentWatchedData && currentWatchedData.rating) {
        watchedBtn.classList.add('active');
        watchedBtnIcon.textContent = '✅';
        watchedBtnText.textContent = currentLang === 'ja' ? '視聴済み' : 'Watched';
        watchedBtn.style.display = 'none';
        starRating.classList.remove('active');

        for (let i = 1; i <= 5; i++) {
          starsHtml += '<span style="color:' + (i <= currentWatchedData.rating ? '#ffc107' : '#444') + '">★</span>';
        }
        currentRatingStars.innerHTML = starsHtml;
        isRatingMode = false;
      } else {
        watchedBtn.classList.remove('active');
        watchedBtnIcon.textContent = '✅';
        watchedBtnText.textContent = currentLang === 'ja' ? '見た' : 'Watched';
        watchedBtn.style.display = 'flex';
        starRating.classList.remove('active');
        ratingDisplay.style.display = 'none';
        removeBtn.style.display = 'none';
        highlightStars(0);
        isRatingMode = false;

    // Add message to UI only (no state change)
    function addMessageToUI(role, content, movies = [], extendedInfo = null) {
      const container = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message ' + role;

      if (role === 'typing') {
        msgDiv.id = 'typing-indicator';
        msgDiv.innerHTML = '<div class="chat-typing"><span></span><span></span><span></span></div>';
      } else {
        let html = '<div class="message-content">' + escapeHtml(content) + '</div>';

        // Add movie carousel if there are recommendations
        if (movies && movies.length > 0) {
          html += '<div class="movie-carousel"><div class="movie-carousel-inner">';
          movies.forEach(movie => {
            const poster = movie.poster_path
              ? TMDB_IMAGE_BASE + movie.poster_path
              : 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 200 300%27%3E%3Crect fill=%27%23222%27 width=%27200%27 height=%27300%27/%3E%3Ctext x=%27100%27 y=%27150%27 text-anchor=%27middle%27 fill=%27%23555%27 font-size=%2740%27%3E%F0%9F%8E%AC%3C/text%3E%3Ctext x=%27100%27 y=%27180%27 text-anchor=%27middle%27 fill=%27%23666%27 font-size=%2712%27%3ENo Image%3C/text%3E%3C/svg%3E';
            const title = getTitle(movie);
            const year = movie.release_date ? movie.release_date.split('-')[0] : '';
            html += `
              <div class="movie-card" onclick="showMovieDetail(${movie.id})">
                <img src="${poster}" alt="${escapeHtml(title)}" loading="lazy">
                <div class="movie-card-info">
                  <div class="movie-card-title">${escapeHtml(title)}</div>
                  <div class="movie-card-meta">
                    <span>${year}</span>
                    <span class="movie-card-rating">★ ${movie.vote_average?.toFixed(1) || '-'}</span>
                  </div>
                </div>
              </div>
            `;
          });
          html += '</div></div>';
        }

        // Add extended info (trailers & OTT providers)
        if (extendedInfo) {
          html += renderExtendedInfo(extendedInfo);
        }

        msgDiv.innerHTML = html;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function addMessage(role, content, movies = [], extendedInfo = null) {
      if (role !== 'typing') {
        chatMessages.push({ role, content, movies, extendedInfo });
      }
      addMessageToUI(role, content, movies, extendedInfo);

      // Show reply templates when AI recommends movies
      if (role === 'assistant' && movies && movies.length > 0) {
        showReplyTemplates(true);
      }
    }

    function removeTypingIndicator() {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
    }

    async function sendChat() {
      if (isSending) return;

      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      addMessage('user', message);

      // Create thread immediately when user sends first message
      if (!currentThreadId && chatMessages.length >= 2) {
        await saveThread();
      }

      isSending = true;
      document.getElementById('send-btn').disabled = true;
      addMessageToUI('typing', '');

      try {
        const authHeaders = await getAuthHeaders();
        console.log('Sending chat with auth:', Object.keys(authHeaders).length > 0 ? 'authenticated' : 'anonymous');

        // Send only role/content to API (not movies)
        const apiMessages = chatMessages.map(m => ({ role: m.role, content: m.content }));

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders },
          body: JSON.stringify({ messages: apiMessages, lang: currentLang })
        });

        removeTypingIndicator();

        if (!response.ok) throw new Error('Request failed');

        const data = await response.json();
        const movies = data.recommendations || (data.recommendation ? [data.recommendation] : []);
        const extendedInfo = data.extendedInfo || null;
        addMessage('assistant', data.message, movies, extendedInfo);

        // Add recommendations to sidebar
        if (movies.length > 0) {
          addRecommendationsToSidebar(movies, message);
        }

        // Auto-save thread after each response
        await saveThread();
      } catch (error) {
        removeTypingIndicator();
        const errorMsg = currentLang === 'ja'
          ? 'すみません、エラーが発生しました。もう一度お試しください。'
          : 'Sorry, an error occurred. Please try again.';
        addMessage('assistant', errorMsg);
        console.error('Chat error:', error);
      } finally {
        isSending = false;
        document.getElementById('send-btn').disabled = false;
        input.focus();
      }
    }

        const trailerLabel = currentLang === 'ja' ? '🎬 予告編' : '🎬 Trailers';
        html += `<div class="extended-section">
          <div class="extended-section-title">${trailerLabel}</div>
          <div class="trailer-list">`;
        info.videos.forEach(v => {
          const thumbUrl = `https://img.youtube.com/vi/${v.key}/mqdefault.jpg`;
          html += `<div class="trailer-item" onclick="openTrailer('${v.key}')">
            <div class="trailer-thumbnail">
              <img src="${thumbUrl}" alt="${escapeHtml(v.name)}" loading="lazy">
              <div class="trailer-play-btn"><span>▶</span></div>
            </div>
            <div class="trailer-name">${escapeHtml(v.name)}</div>
          </div>`;
        });
        html += '</div></div>';
      }

      // OTT Providers
      const allProviders = [
        ...(info.providers.flatrate || []).map(p => ({...p, type: currentLang === 'ja' ? '見放題' : 'Stream'})),
        ...(info.providers.rent || []).map(p => ({...p, type: currentLang === 'ja' ? 'レンタル' : 'Rent'})),
        ...(info.providers.buy || []).map(p => ({...p, type: currentLang === 'ja' ? '購入' : 'Buy'}))
      ];
      if (allProviders.length > 0) {
        const providerLabel = currentLang === 'ja' ? '📺 視聴できるサービス' : '📺 Where to Watch';
        html += `<div class="extended-section">
          <div class="extended-section-title">${providerLabel}</div>
          <div class="provider-list">`;
        allProviders.forEach(p => {
          const logoUrl = `https://image.tmdb.org/t/p/w92${p.logo}`;
          const searchUrl = getProviderSearchUrl(p.name, info.movieTitle);
          html += `<a href="${searchUrl}" target="_blank" rel="noopener" class="provider-item">
            <img src="${logoUrl}" class="provider-logo" alt="${escapeHtml(p.name)}" loading="lazy">
            <div>
              <div class="provider-name">${escapeHtml(p.name)}</div>
              <div class="provider-type">${p.type}</div>
            </div>
          </a>`;
        });
        html += '</div></div>';
      }

      html += '</div>';
      return html;
    }

    function getProviderSearchUrl(providerName, movieTitle) {
      const encoded = encodeURIComponent(movieTitle);
      const urls = {
        'Netflix': `https://www.netflix.com/search?q=${encoded}`,
        'Amazon Prime Video': `https://www.amazon.co.jp/s?k=${encoded}&i=instant-video`,
        'Disney Plus': `https://www.disneyplus.com/ja-jp/search?q=${encoded}`,
        'Apple TV': `https://tv.apple.com/jp/search?term=${encoded}`,
        'U-NEXT': `https://video.unext.jp/search?query=${encoded}`,
        'Hulu': `https://www.hulu.jp/search?q=${encoded}`,
        'ABEMA': `https://abema.tv/search?q=${encoded}`,
        'dTV': `https://video.dmkt-sp.jp/search/title?search_text=${encoded}`,
        'Rakuten TV': `https://tv.rakuten.co.jp/search/?q=${encoded}`,
      };
      return urls[providerName] || `https://www.justwatch.com/jp/search?q=${encoded}`;
    }

    function openTrailer(videoKey) {
      // Use the shared video modal instead of opening a new tab
      MovieModal.openVideoModal(videoKey);
    }

    // Check if user is logged in and load user data
    async function checkUserAuth() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: await getAuthHeaders()
        });
        if (res.ok) {
          currentUser = await res.json();
          MovieWatchlist.setUser(currentUser);
          return true;
        }
      } catch (e) {
        console.error('Auth check failed:', e);
      }
      currentUser = null;
      MovieWatchlist.setUser(null);
      return false;
    }

    // Initialize
    initClerk().then(async () => {
      // Check if user is authenticated
      if (clerkInstance && clerkInstance.session) {
        await checkUserAuth();
      }

      // Load thread list
      await loadThreads();

      // Initialize chat
      initChat();

      // Initialize MovieWatchlist module
      MovieWatchlist.init({
        user: currentUser,
        lang: currentLang,
        getAuthHeaders: getAuthHeaders,
        callbacks: {
          onWatchlistAdded: (movieId, movieTitle) => {
            // Close modal and send auto message to AI
            MovieModal.closeModal();
            const message = currentLang === 'ja'
              ? `「${movieTitle}」が気になる！`
              : `I'm interested in "${movieTitle}"!`;
            sendAutoMessage(message);
          },
          onAuthExpired: () => {
            currentUser = null;
            authToken = null;
          }
        }
      });

      // Check for pending query from index.html hero-search
      const pendingQuery = sessionStorage.getItem('ottflix-chat-query');
      if (pendingQuery) {
        sessionStorage.removeItem('ottflix-chat-query');
        document.getElementById('chat-input').value = pendingQuery;
        sendChat();
      }

      // Initialize shared modal with callback for watched/watchlist/dismissed status
      MovieModal.init({
        lang: currentLang,
        callbacks: {
          afterOpen: (id, movie) => {
            console.log('Modal afterOpen called', { id, movie });
            currentModalMovieId = id;
            // 映画タイトルを保存（日本語優先）
            currentModalMovieTitle = currentLang === 'ja'
              ? (movie.title_ja || movie.title)
              : (movie.title || movie.title_ja);
            // Set current movie in watchlist module
            MovieWatchlist.setCurrentMovie(id, currentModalMovieTitle);
            loadWatchedStatus(id);
            loadDismissedStatus(id);
            loadWatchlistStatus(id); // Uses MovieWatchlist module
          }
        }
      });

      // Update sidebar UI based on language
      if (currentLang === 'en') {
        document.querySelector('.sidebar-title').textContent = 'History';
        document.querySelector('.new-chat-btn').textContent = '+ New';
      }
    });
  </script>
</body>
</html>
