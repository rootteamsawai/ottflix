  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #141414;
      color: #fff;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .logo {
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .logo img {
      height: 28px;
      width: auto;
    }
    .logo:hover { opacity: 0.8; }
    .back-link {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-link:hover { color: #fff; }
    main { padding: 2rem; }
    .page-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #e50914;
    }
    .page-subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }
    .movie-card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #333;
    }
    .movie-info { padding: 0.75rem; }
    .movie-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-meta {
      font-size: 0.75rem;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
    .movie-rating { color: #ffc107; }
    .loading { text-align: center; padding: 2rem; color: #888; }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #666;
    }
    .empty-state h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #888;
    }
    .empty-state p {
      margin-bottom: 1.5rem;
    }
    .empty-state a {
      color: #e50914;
      text-decoration: none;
    }
    .empty-state a:hover {
      text-decoration: underline;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .user-profile:hover {
      background: rgba(255,255,255,0.1);
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
    }
    .user-name {
      font-size: 0.85rem;
      color: #fff;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Upload Section */
    .upload-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .upload-btn { background: #e50914; color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; border: none; transition: background 0.2s; }
    .upload-btn:hover { background: #f40612; }
    .clear-btn { background: #333; color: #888; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .clear-btn:hover { background: #444; color: #fff; }
    .history-status { color: #888; font-size: 0.85rem; }
    .history-status.success { color: #4CAF50; }

    /* Mobile */
    @media (max-width: 768px) {
      header { padding: 0.75rem 1rem; }
      .logo img { height: 22px; }
      main { padding: 1rem; }
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
      .movie-info { padding: 0.5rem; }
      .movie-title { font-size: 0.8rem; }
      .movie-meta { font-size: 0.65rem; }
      .upload-btn { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
      .clear-btn { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
      .history-status { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WBKPHWRW"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <header>
    <div class="header-left">
      <a href="/" class="logo"><img src="/owlnight.png" alt="owlnight"></a>
      <a href="/" class="back-link">&larr; ホームに戻る</a>
    </div>
    <div id="user-profile" class="user-profile" style="display:none">
      <img class="user-avatar" id="user-avatar" src="" alt="">
      <span class="user-name" id="user-name"></span>
    </div>
  </header>

  <main>
    <h1 class="page-title" id="page-title">視聴済み映画</h1>
    <p class="page-subtitle" id="page-subtitle">読み込み中...</p>

    <div class="upload-section">
      <label class="upload-btn">
        <input type="file" id="csv-upload" accept=".csv" hidden>
        Netflix履歴をアップロード
      </label>
      <button id="clear-history" class="clear-btn" style="display:none">履歴クリア</button>
      <span id="history-status" class="history-status"></span>
    </div>

    <div class="movie-grid" id="movies"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <h2 id="empty-title">まだ視聴済みの映画がありません</h2>
      <p id="empty-desc">映画を見たら「見た」ボタンで評価を記録しましょう</p>
      <a href="/">映画を探す &rarr;</a>
    </div>
  </main>

  <script>
    const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
    let currentLang = localStorage.getItem('ottflix-lang') || 'ja';
    let clerkInstance = null;
    let currentUser = null;
    let authToken = null;

    // Wait for Clerk
    function waitForClerk() {
      return new Promise((resolve) => {
        if (window.Clerk) {
          resolve(window.Clerk);
        } else {
          const check = setInterval(() => {
            if (window.Clerk) {
              clearInterval(check);
              resolve(window.Clerk);
            }
          }, 100);
          setTimeout(() => {
            clearInterval(check);
            resolve(null);
          }, 10000);
        }
      });
    }

    async function getAuthHeaders() {
      if (clerkInstance && clerkInstance.session) {
        try {
          authToken = await clerkInstance.session.getToken();
        } catch (e) {
          authToken = null;
        }
      }
      return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
    }

    async function initClerk() {
      try {
        const clerk = await waitForClerk();
        if (!clerk) {
          showLoginRequired();
          return;
        }

        await clerk.load();
        clerkInstance = clerk;

        if (clerkInstance.user && clerkInstance.session) {
          authToken = await clerkInstance.session.getToken();
          await checkAuth();
        } else {
          showLoginRequired();
        }
      } catch (e) {
        console.error('Failed to init Clerk:', e);
        showLoginRequired();
      }
    }

    async function checkAuth() {
      if (!authToken) {
        showLoginRequired();
        return;
      }

      try {
        const res = await fetch('/api/auth/me', {
          headers: await getAuthHeaders()
        });

        if (res.ok) {
          currentUser = await res.json();
          updateUI();
          loadWatchedMovies();
        } else {
          showLoginRequired();
        }
      } catch (e) {
        showLoginRequired();
      }
    }

    function updateUI() {
      if (currentUser) {
        document.getElementById('user-profile').style.display = 'flex';
        document.getElementById('user-avatar').src = currentUser.picture || '';
        document.getElementById('user-name').textContent = currentUser.name || currentUser.email.split('@')[0];
      }
    }

    function showLoginRequired() {
      document.getElementById('page-subtitle').textContent = '';
      document.getElementById('movies').innerHTML = '';
      const empty = document.getElementById('empty-state');
      empty.style.display = 'block';
      document.getElementById('empty-title').textContent = currentLang === 'ja' ? 'ログインが必要です' : 'Login required';
      document.getElementById('empty-desc').textContent = currentLang === 'ja' ? '視聴済み映画を見るにはログインしてください' : 'Please login to see your watched movies';
    }

    async function loadWatchedMovies() {
      try {
        const res = await fetch('/api/watched', {
          headers: await getAuthHeaders()
        });
        const data = await res.json();

        if (!data.watchedMovies || data.watchedMovies.length === 0) {
          document.getElementById('page-subtitle').textContent = '';
          document.getElementById('movies').innerHTML = '';
          document.getElementById('empty-state').style.display = 'block';
          return;
        }

        document.getElementById('page-subtitle').textContent =
          currentLang === 'ja' ? 'あなたが評価した映画 (' + data.watchedMovies.length + '本)' : 'Movies you rated (' + data.watchedMovies.length + ')';

        renderMovies(data.watchedMovies);
      } catch (e) {
        console.error('Failed to load watched movies:', e);
      }
    }

    function getTitle(movie) {
      if (currentLang === 'ja') {
        return movie.title_ja || movie.title;
      }
      return movie.title || movie.title_ja;
    }

    function getPoster(movie) {
      if (currentLang === 'en' && movie.poster_path_en) {
        return TMDB_IMAGE_BASE + movie.poster_path_en;
      }
      if (movie.poster_path) {
        return TMDB_IMAGE_BASE + movie.poster_path;
      }
      return 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 200 300%27%3E%3Crect fill=%27%23222%27 width=%27200%27 height=%27300%27/%3E%3Ctext x=%27100%27 y=%27150%27 text-anchor=%27middle%27 fill=%27%23555%27 font-size=%2740%27%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMovies(movies) {
      const grid = document.getElementById('movies');
      grid.innerHTML = movies.map(m => {
        const poster = getPoster(m);
        const title = getTitle(m);
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          starsHtml += '<span style="color:' + (i <= m.rating ? '#ffc107' : '#444') + '">★</span>';
        }
        return '<div class="movie-card" onclick="openMovie(' + m.movie_id + ')"><img class="movie-poster" src="' + poster + '" alt="' + escapeHtml(title) + '" loading="lazy"><div class="movie-info"><div class="movie-title">' + escapeHtml(title) + '</div><div class="movie-meta"><span class="movie-rating">' + starsHtml + '</span></div></div></div>';
      }).join('');
    }

    function openMovie(id) {
      sessionStorage.setItem('ottflix-open-movie', id);
      window.location.href = '/';
    }

    // Update text based on language
    if (currentLang === 'en') {
      document.getElementById('page-title').textContent = 'Watched Movies';
      document.querySelector('.back-link').innerHTML = '&larr; Back to Home';
      document.querySelector('.upload-btn').innerHTML = '<input type="file" id="csv-upload" accept=".csv" hidden>Upload Netflix History';
      document.getElementById('clear-history').textContent = 'Clear History';
    }

    // Session ID for history upload
    function getSessionId() {
      let id = localStorage.getItem('ottflix-session');
      if (!id) {
        id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        localStorage.setItem('ottflix-session', id);
      }
      return id;
    }

    // File upload handler
    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('history-status');
      statusEl.textContent = currentLang === 'ja' ? 'アップロード中...' : 'Uploading...';
      statusEl.classList.remove('success');
      const formData = new FormData();
      formData.append('file', file);
      formData.append('sessionId', getSessionId());
      try {
        const res = await fetch('/api/history/upload', { method: 'POST', body: formData });
        const result = await res.json();
        if (result.success) {
          const matchedText = currentLang === 'ja' ? '本がマッチ' : ' matched';
          statusEl.textContent = result.matchedCount + '/' + result.totalEntries + matchedText;
          statusEl.classList.add('success');
          document.getElementById('clear-history').style.display = 'inline-block';
          loadWatchedMovies();
        } else {
          statusEl.textContent = currentLang === 'ja' ? 'アップロード失敗' : 'Upload failed';
        }
      } catch (err) {
        statusEl.textContent = currentLang === 'ja' ? 'エラーが発生しました' : 'An error occurred';
      }
      e.target.value = '';
    }

    document.getElementById('csv-upload').addEventListener('change', handleFileUpload);

    document.getElementById('clear-history').addEventListener('click', async () => {
      try {
        await fetch('/api/history/' + getSessionId(), { method: 'DELETE' });
        document.getElementById('clear-history').style.display = 'none';
        document.getElementById('history-status').textContent = '';
        loadWatchedMovies();
      } catch (e) {}
    });

    initClerk();
  </script>
</body>
</html>
